services:
  listener:
    profiles: [history]
    build: .
    env_file: .env
    restart: unless-stopped
    volumes:
      - listener_data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  listener-live:
    build: .
    command: ["python", "stream.py"]
    env_file: .env
    restart: unless-stopped
    volumes:
      - listener_data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  enricher:
    profiles: [enrichment]
    build: .
    command: ["python", "enricher.py"]
    env_file: .env
    restart: unless-stopped
    volumes:
      - listener_data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  dashboard:
    build: .
    command: ["python", "dashboard.py", "--host", "0.0.0.0", "--db", "data/live.sqlite"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - listener_data:/app/data:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  alerts:
    build: .
    command: ["python", "alert_engine.py", "--db", "data/live.sqlite"]
    env_file: .env
    restart: unless-stopped
    volumes:
      - listener_data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  wallet-profiler:
    build: .
    command: ["python", "wallet_profiler.py", "--db", "data/live.sqlite"]
    restart: unless-stopped
    volumes:
      - listener_data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  market-normalizer:
    build: .
    command: ["python", "market_normalizer.py", "--db", "data/live.sqlite"]
    env_file: .env
    restart: unless-stopped
    volumes:
      - listener_data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  listener_data:
